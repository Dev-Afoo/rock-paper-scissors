<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="game.js" defer></script>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="scoreboard">

    </div>

    <p>Click on a button to start the game! First to five points win!</p>

    <div class="btn-container">
        <button id="btn1" alt="A button for the selection Rock" data-weapon="rock">Rock</button>
        <button id="btn2" alt="A button for the selection Paper"data-weapon="paper">Paper</button>
        <button id="btn3" alt="A button for the selection Scissors" data-weapon="scissors">Scissors</button>
    </div>
</body>
</html>
